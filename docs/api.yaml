openapi: 3.0.3
info:
  title: AI Summary Notes (MVP-Lite)
  version: "0.1.0"
  description: |
    Spring Boot 기반 노트 CRUD + 요약(Mock/AI) API.
    - Base URL: `/`
    - 공통 헤더: `X-USER-ID: <number>`
    - Content-Type: `application/json; charset=utf-8`
servers:
  - url: /
tags:
  - name: Notes
    description: 노트 CRUD
  - name: Summary
    description: 노트 요약 생성/조회

components:
  parameters:
    XUserId:
      name: X-USER-ID
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
      description: Mock user id (e.g., 1)
    NoteId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Query:
      name: query
      in: query
      required: false
      schema: { type: string }
      description: 제목 검색어(부분 일치)
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }

  requestBodies:
    NoteCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, contentMd]
            properties:
              title: { type: string, maxLength: 200 }
              contentMd: { type: string }
    NoteUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string, maxLength: 200 }
              contentMd: { type: string }
              status: { type: string, description: "예: DRAFT | PUBLISHED (문자열)" }
    SummaryCreate:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              style:
                type: string
                description: brief(기본) 또는 detailed
                enum: [brief, detailed]

  schemas:
    ErrorResponse:
      type: object
      required: [timestamp, path, error, code, messages]
      properties:
        timestamp: { type: string, format: date-time }
        path: { type: string }
        error: { type: string, example: "Bad Request" }
        code: { type: string, example: "VALIDATION_FAILED" }
        messages:
          type: array
          items: { type: string }
          example: ["title must not be blank"]

    NoteResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        contentMd: { type: string }
        contentText: { type: string }
        status: { type: string }

    SummaryResp:
      type: object
      properties:
        oneLine: { type: string, description: "80자 이내 한 줄 요약" }
        paragraph: { type: string, description: "문단 또는 bullet" }
        model: { type: string, example: "mock-1" }
        style:
          type: string
          enum: [brief, detailed]
        tokensPrompt: { type: integer }
        tokensOutput: { type: integer }

    SummaryLatestResp:
      allOf:
        - $ref: '#/components/schemas/SummaryResp'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }

    SummaryItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        oneLine: { type: string }
        model: { type: string }
        style: { type: string, enum: [brief, detailed] }
        tokensPrompt: { type: integer }
        tokensOutput: { type: integer }
        createdAt: { type: string, format: date-time }

    PageNoteResponse:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/NoteResponse' }
        number: { type: integer, description: "현재 페이지(0-base)" }
        size: { type: integer, description: "페이지 크기" }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }

    PageSummaryItem:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SummaryItem' }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }

paths:

  /api/notes:
    get:
      tags: [Notes]
      summary: 노트 목록 조회(검색/페이징)
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageNoteResponse' }
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Notes]
      summary: 노트 생성
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        $ref: '#/components/requestBodies/NoteCreate'
      responses:
        "200":
          description: 생성된 노트 ID
          content:
            application/json:
              schema:
                type: integer
                format: int64
                example: 1
        "400":
          description: 유효성 검증 실패
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/notes/{id}:
    get:
      tags: [Notes]
      summary: 노트 상세
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/NoteId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteResponse' }
        "400":
          description: not found/forbidden 등 클라이언트 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      tags: [Notes]
      summary: 노트 수정(부분)
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        $ref: '#/components/requestBodies/NoteUpdate'
      responses:
        "200":
          description: OK
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Notes]
      summary: 노트 삭제
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/NoteId'
      responses:
        "200":
          description: OK
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/notes/{id}/summary:
    post:
      tags: [Summary]
      summary: 요약 생성(Mock/AI)
      description: style 미지정 시 기본값 brief
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        $ref: '#/components/requestBodies/SummaryCreate'
      responses:
        "200":
          description: 요약 생성 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryResp' }
        "400":
          description: 본문 짧음/권한 오류/노트 없음 등
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Summary]
      summary: 최신 요약 조회
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/NoteId'
      responses:
        "200":
          description: 최신 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryLatestResp' }
        "204":
          description: 요약 없음
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/notes/{id}/summary/list:
    get:
      tags: [Summary]
      summary: 요약 이력(페이징)
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/NoteId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageSummaryItem' }
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
