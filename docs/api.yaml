
---

# `/docs/api.yaml`

```yaml
openapi: 3.0.3
info:
  title: AI Summary Notes (MVP-Lite)
  version: "0.2.0"
  description: |
    헤더 기반 식별(`X-USER-ID`)을 사용하는 노트 CRUD + 요약(Mock/AI) API.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XUserId:
      name: X-USER-ID
      in: header
      required: true
      description: Mock user id (예: 1)
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Query:
      name: query
      in: query
      required: false
      schema:
        type: string
    Tag:
      name: tag
      in: query
      required: false
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        path: { type: string }
        error: { type: string, example: Bad Request }
        code: { type: string, example: VALIDATION_FAILED }
        messages:
          type: array
          items: { type: string }
    NoteCreate:
      type: object
      required: [title, contentMd]
      properties:
        title:
          type: string
          maxLength: 200
        contentMd:
          type: string
          description: Markdown 원문
        tags:
          type: string
          description: 쉼표 구분 태그 (예: "ai,spring")
    NoteUpdate:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        contentMd: { type: string }
        status:
          type: string
          description: DRAFT | PUBLISHED 등(문자열 저장)
        tags:
          type: string
          description: 쉼표 구분 태그
    NoteResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        contentMd: { type: string }
        contentText: { type: string }
        status: { type: string }
        tags: { type: string }
    PageNoteResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/NoteResponse'
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
    SummaryReq:
      type: object
      properties:
        style:
          type: string
          enum: [brief, detailed]
          default: brief
    SummaryResp:
      type: object
      properties:
        oneLine: { type: string }
        paragraph: { type: string }
        model: { type: string, example: gpt-4o-mini }
        style: { type: string, enum: [brief, detailed] }
        tokensPrompt: { type: integer }
        tokensOutput: { type: integer }
        cost:
          type: number
          format: double
    SummaryLatestResp:
      allOf:
        - $ref: '#/components/schemas/SummaryResp'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
    SummaryItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        oneLine: { type: string }
        model: { type: string }
        style: { type: string, enum: [brief, detailed] }
        tokensPrompt: { type: integer }
        tokensOutput: { type: integer }
        cost:
          type: number
          format: double
        createdAt: { type: string, format: date-time }
    PageSummaryItem:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SummaryItem'
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
    LoginReq:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: 기존 유저 재사용 시
        nickname:
          type: string
          description: 신규 유저 생성 시
    LoginResp:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        howToUseHeader: { type: string }
paths:
  /api/notes:
    get:
      summary: 노트 목록 조회
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        "200":
          description: OK (query, tag 개별/동시 필터 지원)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageNoteResponse'
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: 노트 생성
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        "200":
          description: 생성된 노트 ID
          content:
            application/json:
              schema:
                type: integer
                format: int64
        "400":
          description: 유효성 실패/헤더 누락 등
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/notes/{id}:
    get:
      summary: 노트 상세
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        "400":
          description: 잘못된 요청(존재하지 않음/권한 없음 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: 노트 수정(부분)
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdate'
      responses:
        "200":
          description: OK
        "400":
          description: 잘못된 요청(존재하지 않음/권한 없음 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: 노트 삭제
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
        "400":
          description: 잘못된 요청(존재하지 않음/권한 없음 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/notes/{id}/summary:
    post:
      summary: 요약 생성(Mock/AI)
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryReq'
      responses:
        "200":
          description: 생성된 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResp'
        "400":
          description: 잘못된 요청(노트 없음/권한 없음/본문 짧음 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: 최신 요약 1개 조회
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 최신 요약 존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryLatestResp'
        "204":
          description: 요약 없음
        "400":
          description: 잘못된 요청(노트 없음/권한 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/notes/{id}/summary/list:
    get:
      summary: 요약 이력(페이징)
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSummaryItem'
        "400":
          description: 잘못된 요청(노트 없음/권한 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/me:
    get:
      summary: 현재 사용자 프로필
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/{id}:
    get:
      summary: 사용자 단일 조회
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: 잘못된 요청/없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      summary: 간단 로그인(Header-Auth용)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResp'
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
