server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:ainote;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none            
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true               
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

ai:
  provider: gemini   # mock | openai | ollama | gemini
  temperature: ${AI_TEMPERATURE:0.2}
  timeout-ms: ${AI_TIMEOUT_MS:20000}
  fallbackOnError: ${AI_FALLBACK_ON_ERROR:true}   # 실패 시 Mock으로 폴백 여부
  cacheMinutes: ${AI_CACHE_MINUTES:10}            # 최신 요약을 재사용할 TTL(min)
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1}
  costs:
    prompt_per_1k: ${AI_COST_PROMPT:0.0}
    output_per_1k: ${AI_COST_OUTPUT:0.0}
  gemini:
    api-key: ${GEMINI_API_KEY:AIzaSyAxSaGzNyW3udJIe2M6IGwvnqeIOmLzYms}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

    
