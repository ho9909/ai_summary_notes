spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/ainote}
    username: ${DB_USER:ainote}
    password: ${DB_PASS:ainote}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080

ai:
  provider: ${AI_PROVIDER:mock}
  openai:
    base-url: https://api.openai.com
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    temperature: ${OPENAI_TEMPERATURE:0.2}
    timeout-ms: ${OPENAI_TIMEOUT_MS:20000}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
    model: ${OLLAMA_MODEL:llama3.1}
    temperature: ${OLLAMA_TEMPERATURE:0.2}
    timeout-ms: ${OLLAMA_TIMEOUT_MS:20000}
  costs:
    prompt_per_1k: ${AI_COST_PROMPT:0.003}
    output_per_1k: ${AI_COST_OUTPUT:0.006}
  fallbackOnError: ${AI_FALLBACK_ON_ERROR:true}
  cacheMinutes: ${AI_CACHE_MINUTES:10}
