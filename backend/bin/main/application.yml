server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:ainote;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none            # ✅ 스키마는 Flyway가 만듭니다
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true               # ✅ 꼭 true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
