version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ainote
      POSTGRES_USER: ainote
      POSTGRES_PASSWORD: ainote
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/ainote
      DB_USER: ainote
      DB_PASS: ainote
      AI_PROVIDER: mock
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # OPENAI_MODEL: gpt-4o-mini
    ports: ["8080:8080"]
    depends_on: [db]
  frontend:
    build:
      context: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  dbdata:
